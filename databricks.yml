bundle:
  name: customer_sales_analytics

# Include configuration files
include:
  - resources/*.yml

# Define variables that can be used across all targets
variables:
  catalog:
    description: Target catalog name
    default: dev_catalog
  
  schema:
    description: Target schema name
    default: customer_analytics
  
  source_catalog:
    description: Source catalog for sample data
    default: samples
  
  source_schema:
    description: Source schema for sample data
    default: tpcds_sf1
  
  job_name:
    description: Name of the job
    default: customer_sales_job

# Define targets (environments)
targets:
  # Development environment
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-a9aee957-443a.cloud.databricks.com
    
    # Override variables for dev
    variables:
      catalog: dev_catalog
      schema: customer_analytics
      source_catalog: samples
      source_schema: tpcds_sf1
    
    resources:
      jobs:
        customer_sales_job:
          name: "[DEV] Customer Sales Analytics"
          
  # Production environment
  prod:
    mode: production
    workspace:
      host: https://dbc-8dfc6ed2-4b87.cloud.databricks.com
      root_path: /Workspace/Prod/customer_sales_analytics
    
    # Override variables for prod
    variables:
      catalog: prod_catalog
      schema: customer_analytics
      source_catalog: samples
      source_schema: tpcds_sf1
    
    resources:
      jobs:
        customer_sales_job:
          name: "[PROD] Customer Sales Analytics"